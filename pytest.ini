[pytest]
testpaths = tests backend/tests ml-engine/tests
pythonpath = . backend ml-engine
addopts = --import-mode=importlib
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*PydanticDeprecatedSince20.*
    ignore:.*ConvergenceWarning.*
    ignore:.*EstimationWarning.*
